<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7A1B22" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GTRAMS" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    
    <title>GTRAMS</title>
    <script>
      (function() {
        try {
          const isAuthPage = ['/', '/login', '/register', '/forgot-password'].some(function(p) {
            return window.location.pathname === p || window.location.pathname.startsWith(p + '/');
          });

          if (isAuthPage) {
            document.documentElement.classList.add('auth-view');
            document.documentElement.style.backgroundColor = '#120204';
            document.body.style.backgroundColor = '#120204';
          }

          const isReviewStation = window.location.pathname.includes('/franchise-approval/review');
          if (isReviewStation) {
            document.documentElement.classList.add('review-station-active');
            document.documentElement.style.zoom = '1';
          } else if (window.innerWidth >= 769) {
            document.documentElement.style.zoom = '0.9';
          } else {
            document.documentElement.style.zoom = '1';
          }

          const savedTheme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (savedTheme !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
