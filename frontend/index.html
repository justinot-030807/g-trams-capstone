<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64x64.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#9E2A2B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="G-TRAMS" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    
    <!-- Google Fonts: IBM Plex Sans & IBM Plex Mono (Weights: 400, 500, 600) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

    <title>G-TRAMS | Municipality of Gasan</title>
    <script>
      (function() {
        try {
          const isAuthPage = ['/', '/login', '/register', '/forgot-password'].some(function(p) {
            return window.location.pathname === p || window.location.pathname.startsWith(p + '/');
          });

          if (isAuthPage) {
            document.documentElement.classList.add('auth-view');
            document.documentElement.style.backgroundColor = '#14110F';
            document.body.style.backgroundColor = '#14110F';
          }

          // Unify standard zoom to 1.0 (100%) so all text respects minimum 14px body standard
          document.documentElement.style.zoom = '1';

          // Restore operator text scale preference (normal, large, xlarge)
          const savedScale = localStorage.getItem('gtrams_text_scale');
          if (savedScale && savedScale !== 'normal') {
            document.documentElement.setAttribute('data-text-scale', savedScale);
          }

          const savedTheme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (savedTheme !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
